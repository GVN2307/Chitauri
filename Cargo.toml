[package]
name = "chitauri"
version = "0.1.0"
edition = "2021"
description = "Pure Rust mobile YouTube mini-search, offline audio downloader with .nomedia isolation, and music player"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.android]
package = "com.chitauri.audio"
apk_name = "ChitauriAudio"
resources = "res"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Chitauri"
icon = "@mipmap/ic_launcher"
extract_native_libs = true
debuggable = true

[package.metadata.android.application.activity]
exported = true
label = "Chitauri"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "password123"
key_alias = "chitauri"
key_password = "password123"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
eframe = { version = "0.30", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.30", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rodio = { version = "0.20", default-features = false, features = ["symphonia-all"] }
dirs = "6.0"
chrono = "0.4"
id3 = "1.16"
anyhow = "1.0"
thiserror = "2.0"
rand = "0.8"
regex = "1.11"
[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

