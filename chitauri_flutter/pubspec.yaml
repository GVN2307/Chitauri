name: chitauri_flutter
description: "Chitauri High-Fidelity YouTube Audio Suite & Offline Turntable Player"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  webview_flutter: ^4.10.0
  youtube_explode_dart: ^2.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/catalog/
